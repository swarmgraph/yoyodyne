# The delivery loop for a project whose integration a person still approves.
#
# It is delivery.yaml up to the reviewer's approval: the same claim, develop,
# check and review states, the same repair transitions handing a failing check,
# a refused change or the reviewer's findings back to the developer, and the
# same budgets behind them, because approvals.integration set to human withholds
# the merge and nothing before it. `verifyReviewAndFinish` is where the two
# paths part, and it parts after the repair loop rather than before it: its
# non-automatic branch runs the same loop and then hands the approved change to
# `handOverApproved` instead of promoting it.
#
# What replaces the promotion is `publish`. A publishing run opens or updates
# its pull request there and nowhere earlier -- the developer's attempts are
# committed on the run branch but not pushed -- so the request a person merges
# from only ever carries a change the reviewer approved, and it is left open for
# that person to merge. Nothing on this path merges it or moves the target
# branch. A run that stays local publishes nothing there and goes straight on.
#
# It is a second definition rather than a branch inside delivery.yaml because a
# definition has no way to ask what the project configured -- it selects actions
# and names destinations, and that is the whole of what it can do. Which of the
# two a project runs is a binding rather than a transition.
#
# What it shares with delivery.yaml, it shares deliberately: the same actions
# and the same outcome vocabulary. The `complete` state is one of them, and it
# is the last state here rather than a step before the cleanup: a change nobody
# has promoted has nothing to clean up, so recording the outcome on the item and
# pricing what the run spent is the whole of what is left to do.
schema: 1
id: delivery-human-approval
summary: claim a work item, develop a change, gate it on the checks and an independent verdict, and open its pull request for the person who merges it
initial: claim
states:
  claim:
    action: work-item.claim
    summary: take the work item this run was dispatched for and assemble the context its developer is given
    on:
      claimed: develop
      unavailable: abandoned
  develop:
    action: candidate.develop
    summary: invoke the developer in this run's worktree, and commit what the attempt produced on the run branch
    on:
      produced: check
      reissued: develop
      relaunches-spent: blocked
      stopped: abandoned
  check:
    action: candidate.check
    summary: refuse a change that touched paths this work item does not grant, then run the project's configured checks over it
    on:
      passed: review
      # The same repair inputs delivery.yaml hands back, each with its outcome
      # for the round that finds the shared repair budget spent.
      failed: develop
      failed-unrepaired: blocked
      refused: develop
      refused-unrepaired: blocked
      # A check that could not run at all is not repair input and ends the run
      # instead of spending an attempt.
      unrunnable: abandoned
  review:
    action: candidate.review
    summary: obtain one independent verdict on the change from a reviewer with read-only access
    on:
      approved: publish
      changes-requested: develop
      unresolved: blocked
      stopped: abandoned
  publish:
    action: candidate.publish
    summary: push the approved change and open or update its pull request, left open for the person who merges it
    on:
      published: complete
      # The approved change's checks were narrowed to what it touched and, run
      # over the whole module before it is handed over, failed: the approval is
      # cleared and the failure goes back through the check to the developer, as
      # it does at the promotion in delivery.yaml.
      superseded: check
      # Pushing the branch or opening the request failed in a way no retry
      # answered; nothing was merged, and the change stays on its branch.
      stopped: abandoned
  complete:
    action: run.complete
    summary: record on the work item what this run produced, and price what it spent
    on:
      completed: preserved
terminals:
  preserved:
    summary: the change passed its checks and was approved by the reviewer, and is on its branch -- and in an open pull request where the project publishes -- with the outcome recorded on the item for the person who merges it
  blocked:
    summary: the run stopped on something a person has to decide, with the worktree and branch preserved and a durable blocker on the item
  abandoned:
    summary: the run ended without a change that passed its checks and its review, so the person who merges was offered nothing; the failure is recorded on the item, the item is neither closed nor blocked, and the worktree and branch are left standing for reconciliation to settle
