<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <p class="render-note">Opened over the busy render, which is not repeated here.</p>
    <div id="grouping" class="popup" role="dialog" aria-modal="true" aria-labelledby="grouping-heading" data-state="loading">
      <div id="grouping-backdrop" class="popup-backdrop"></div>
      <div class="popup-card">
        <div class="popup-head">
          <div>
            <h2 id="grouping-heading" class="popup-title">What the spend accomplished</h2>
            <p id="grouping-note" class="popup-note">the current week and the three before it, Pacific time</p>
          </div>
          <button type="button" id="grouping-close" class="popup-close">Close</button>
        </div>
        <div class="section-loading">
          <p class="waiting">
            <span class="pulse" aria-hidden="true"></span>
            <span id="grouping-waiting">Reading what each pass, review, and item came to…</span>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
