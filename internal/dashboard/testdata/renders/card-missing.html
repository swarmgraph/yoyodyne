<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <p class="render-note">Opened over the busy render, which is not repeated here.</p>
    <div id="card" class="popup" role="dialog" aria-modal="true" aria-labelledby="card-heading" data-state="empty">
      <div id="card-backdrop" class="popup-backdrop"></div>
      <div class="popup-card">
        <div class="popup-head">
          <div>
            <h2 id="card-heading" class="popup-title">title unavailable (yoyodyne-ifd.212)</h2>
            <p id="card-note" class="popup-note"></p>
          </div>
          <button type="button" id="card-close" class="popup-close">Close</button>
        </div>
        <div class="section-empty">
          <p id="card-empty" class="empty">No work item is recorded under yoyodyne-ifd.212: it may have been closed or removed since the page last read where the work stands.</p>
        </div>
      </div>
    </div>
  </body>
</html>
