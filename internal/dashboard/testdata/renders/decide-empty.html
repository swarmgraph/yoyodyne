<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <p class="render-note">Opened over the decisions render, which is not repeated here.</p>
    <div id="decide" class="popup" role="dialog" aria-modal="true" aria-labelledby="decide-heading" data-state="empty">
      <div id="decide-backdrop" class="popup-backdrop"></div>
      <div class="popup-card">
        <div class="popup-head">
          <div>
            <h2 id="decide-heading" class="popup-title">Your decisions</h2>
            <p id="decide-note" class="popup-note">read 14:05:09</p>
          </div>
          <button type="button" id="decide-close" class="popup-close">Close</button>
        </div>
        <div class="section-empty">
          <p id="decide-empty" class="empty">Nothing the attention line names as yours waits on your approve or decline, as of 14:05:09.</p>
        </div>
      </div>
    </div>
  </body>
</html>
