<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>yoyodyne — yoyo dashboard</title>
    <link rel="stylesheet" href="../../assets/dashboard.css">
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="mark" aria-hidden="true">yoyo</span>
        <h1>yoyodyne</h1>
      </div>
      <p class="observed">
        observed
        <time id="observed-at">—</time>
        <span id="freshness" class="freshness"></span>
      </p>
      <p class="switch-token">
        <button type="button" id="switch-token" class="switch-token-button">Use a different token</button>
      </p>
    </header>
    <main id="page" data-state="loading">
      <section class="state state-loading" aria-live="polite">
        <p class="waiting">
          <span class="pulse" aria-hidden="true"></span>
          Reading where the harness stands…
        </p>
      </section>
    </main>
    <script src="about:blank" data-note="the script ran once to produce this render; it is not loaded again here"></script>
  </body>
</html>
