# Yoyodyne's own delivery loop, as this project's own file.
#
# This is the definition every run of this repository executes. It is here
# rather than only in the executable because a project owns its sequence: a copy
# under `.yoyodyne/workflows/<workflow id>.yaml` is read in place of the one the
# build ships, nothing is merged between the two, and a copy that does not
# compile stops the run that would have executed it rather than quietly falling
# back to anything. docs/configuration.md#running-a-work-item-against-the-workflow-definition
# says what a copy may change and what it may not.
#
# It is the built-in verbatim today, so that adopting it changed the sequence
# not at all -- what it changed is who owns it. `internal/orchestrator/delivery.yaml`
# is that built-in, and a test compares the two as decoded definitions, ignoring
# comments, so this header is free to differ. Any difference in what they say
# fails it, naming where they read differently, rather than leaving this
# repository running a sequence its parity harness never measured. The one
# difference it lets through is a transition the built-in routes and this copy
# does not route at all: that is reported as one this copy has not yet adopted,
# and a run here that takes it records a divergence until this copy does.
# Diverging on purpose means changing that test as well, which is the point at
# which somebody has decided to.
#
# Everything below is that definition. Its own account of itself follows.
#
# The delivery loop, as data.
#
# This is the sequence `internal/orchestrator` runs today under automatic
# integration -- claim a work item, develop a change, gate it, promote it, clean
# up after it -- written down as the states, transitions and terminals the
# pipeline actually has. What it is held to is
# docs/delivery-pipeline-baseline.md and the traces beneath it: every recorded
# delivery path is walked through the built-in copy by the parity harness in
# parity_test.go, and a path it cannot express fails that test by name.
#
# Nothing in the delivery path performs anything through it. Production still
# runs the sequence Go control flow puts it in, and this file changes none of
# that; what it adds is that the sequence is somewhere a reviewer can read whole
# and something a test can diff against the frozen behaviour -- and, for every
# run a project that has not rolled back starts, something a real run is stepped
# through beside the work, so the sequence this file chooses is recorded next to
# the sequence the run took.
#
# Three things about it are worth knowing before reading it as the pipeline.
#
#   * There is no `publish` state. `candidate.develop` ends by calling
#     publishAttempt -- which is why the registry declares `forge.publish` on the
#     developer -- so a definition that also selected `candidate.publish` would
#     publish every attempt twice.
#   * The `complete` state between `integrate` and `clean-up` is where the work
#     item is finished with: the outcome recorded on it, the item settled now its
#     promotion is, and what the run spent priced against it. Settled is closed
#     for a landing the developer claimed discharges the item and back in the
#     backlog for one it claimed does not, which is why this state is not named
#     for the closure. It is a state of its own because that is what the pipeline
#     does there -- `(*activeRun).finish` performs it and then the cleanup -- and
#     a definition that ran the promotion straight into the cleanup would promote
#     a change and never settle its item. The `complete` and `delivered`
#     summaries below say both outcomes rather than only the closure. A summary
#     is digest-bearing, so moving one means moving this repository's own copy at
#     `.yoyodyne/workflows/delivery.yaml` in the same change, and that path is
#     refused to a developer run without a grant.
#   * A budget is not something a definition can ask about. The run counts its
#     own repair attempts, relaunches and integration retries, so what appears
#     here is the pair of outcomes the run distinguishes: the failure handed back
#     to the developer, and the same failure with the budget spent.
schema: 1
id: delivery
summary: claim a work item, develop a change, gate it on the checks and an independent verdict, and promote it
initial: claim
states:
  claim:
    action: work-item.claim
    summary: take the work item this run was dispatched for and assemble the context its developer is given
    on:
      claimed: develop
      unavailable: abandoned
  develop:
    action: candidate.develop
    summary: invoke the developer in this run's worktree, and publish what the attempt produced
    on:
      produced: check
      # The same attempt made again: an exhausted usage limit waited out, a
      # transiently overloaded server, an invocation the harness stopped on time,
      # or a provider that died without judging the work. All four reissue the
      # attempt in the session the refused one established, which is one
      # transition rather than four because the developer state is where the run
      # goes back to in every one of them.
      reissued: develop
      # The relaunch budget spent. What stopped the run is the provider rather
      # than the change, so the work is preserved and a person decides.
      relaunches-spent: blocked
      # Nothing to hand on: the operator stopped the run, or the invocation
      # failed in a way no relaunch answers.
      stopped: abandoned
  check:
    action: candidate.check
    summary: refuse a change that touched paths this work item does not grant, then run the project's configured checks over it
    on:
      passed: review
      # The two repair inputs this state decides, each with the outcome it has
      # when the shared repair budget is gone. The refusal is decided in front of
      # the checks, so a change refused for what it touched never ran them.
      failed: develop
      failed-unrepaired: blocked
      refused: develop
      refused-unrepaired: blocked
      # A check that could not run at all -- timed out, cancelled, or
      # infrastructure that failed -- is not repair input and ends the run
      # instead of spending an attempt.
      unrunnable: abandoned
  review:
    action: candidate.review
    summary: obtain one independent verdict on the change from a reviewer with read-only access
    on:
      approved: integrate
      changes-requested: develop
      unresolved: blocked
      # The boundary before a verdict is bought, which is where a run the
      # operator stopped ends.
      stopped: abandoned
  integrate:
    action: candidate.integrate
    summary: take the target branch's promotion lease and promote the approved change onto it
    on:
      integrated: complete
      # A promotion that lost its race for the target branch is replayed onto
      # where the target went and re-earns the whole gate: the checks against the
      # replayed change, and a fresh independent verdict on it.
      superseded: check
      contended: blocked
      # A replay that conflicts is never resolved by the harness. It goes back to
      # the developer that wrote the change, in its own session, with the change
      # moved onto where the target went and the disagreement left as Git's
      # markers; what the developer settles re-earns the whole gate from there.
      reconciling: develop
      # The same conflict with the repair or integration budget spent: both sides
      # are left intact and the item is blocked.
      conflicted: blocked
  complete:
    action: run.complete
    summary: record on the work item what this run produced, settle it now its promotion is -- closed where the run's landing discharges the item, back in the backlog where it lands evidence instead -- and price what it spent
    on:
      completed: clean-up
  clean-up:
    action: run.clean-up
    summary: remove the worktree and branch this run created, once its change is proven to be somewhere else, and record the run as complete once nothing it made is left
    on:
      cleaned: delivered
      # An artifact that survived is reported on a succeeded run rather than
      # turning it into a failure: the change is integrated and the item settled.
      partial: delivered
terminals:
  delivered:
    summary: the change is on the target branch, the item is closed where the run's landing discharges it and back in the backlog where it lands evidence instead, and what the run made is gone or reported as surviving
  blocked:
    summary: the run stopped on something a person has to decide, with the worktree and branch preserved and a durable blocker on the item
  abandoned:
    summary: the run stopped with nothing promoted and no blocker for anybody to decide about; the worktree and branch are left standing for reconciliation to settle
