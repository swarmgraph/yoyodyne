# Yoyodyne project configuration.
#
# This file is complete. Every value the harness uses is written here, so what
# the file says is what runs and there is nothing to look up somewhere else.
# It was generated from the builtin:v1 template inside the executable, and
# the personas beside it were copied from there at the same time; both are this
# project's to edit now.
#
# That ownership has a price worth knowing up front: a later Yoyodyne that
# improves a persona or corrects a model selector does not reach this project.
# Run "yoyo init" again in a scratch directory and merge what changed if you
# want those improvements.
#
# "yoyo config show --effective --origins" reports the resolved values and
# where each one came from.
#
# This repository is the one that also contains the template, so it has two
# copies of the persona text and they are not the same file. personas/ here is
# what Yoyodyne's own agents read; internal/config/builtin/v1/personas/ is what
# "yoyo init" gives a new project. Change both when the change is meant for
# both.
version: 1

product:
  id: yoyodyne
  repository: .
  # Every role reads the documents under this directory as authoritative product
  # intent: every document filed here, not only the brief and the goals. The
  # management conversations are briefed with all of them, and every developer
  # and reviewer is handed them beside the work item it is given. A README here
  # is read as the directory index it is, and what it says about ownership as a
  # rule. Beside them, and labeled as a description of what is built rather than
  # as intent, the Lead Product Manager is also given the configured set of
  # operator-facing documents below and the help the commands print -- not
  # this file, not the source, not the design document. It must stay inside the
  # repository.
  specifications: docs/product
  # Codex exec caps one input at 1,048,576 characters. Keep the descriptive
  # briefing compact; authoritative intent and role-owned artifacts are still
  # delivered separately, and read-only tools can inspect the remaining docs.
  shipped_documentation:
    - README.md
    - docs/work.md
    - docs/provider-plugins.md
  # The architect's durable architectural invariants: one Markdown file per
  # constraint, named by its id. The harness delivers the ones relevant to a
  # work item into the developer's context and the reviewer's evidence. A
  # project with no such directory simply has no invariants yet.
  invariants: docs/decisions/invariants
  # The architect's two artifact homes: designs and specifications, and the
  # decision records the invariants above are extracted from. Every Markdown
  # file in these directories and in the specifications directory carries its
  # identity and metadata in frontmatter -- id, kind, status, what it supports,
  # and a revision log -- so downstream work can refer to one durably. A
  # directory that does not exist simply records no artifacts of that kind yet.
  designs: docs/designs
  decisions: docs/decisions

# The humans this project recognizes, one entry each, binding the identifier
# namespaces they are known by. Authority attaches to the human rather than to
# any one namespace: an act is authorized by resolving whichever namespace it
# arrived through -- a commit's address, a push's forge account, a thread
# reply's member id -- to a person, and then asking what that person may do.
# The Slack allow-list is derived from this rather than authored beside it: the
# humans granted direct-work who bound a slack_member_id.
operators:
  mason-bryant:
    git_email: hamneggs@gmail.com
    forge_account: mason-bryant
    slack_member_id: U0BR9M2EKKP # from your profile → "Copy member ID"
    grants:
      - own-intent
      - direct-work

slack:
  enabled: true
  # The faces are the project's own, committed under docs/slack/avatars and
  # served from the repository; versioned filenames because Slack caches
  # icons aggressively. operations-v1.png waits, unmapped, for the post-v1
  # operations role. The harness wears the product's engraved gear, the same
  # image as the Slack app icon (docs/slack/app-icon-v1.png).
  avatars:
    product-manager: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/pm-v1.png
    architect: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/architect-v1.png
    development-manager: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/dev-manager-v1.png
    developer: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/developer-v2.png
    reviewer: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/verifier-v1.png
    harness: https://raw.githubusercontent.com/swarmgraph/yoyodyne/main/docs/slack/avatars/harness-v1.png
  channel: C0BQY3ZHE8P

# The dashboard serves under a stored token rather than a fresh one each start,
# so a restart does not hand the operator a new token to paste (yoyodyne-ifd.432.3).
# "file" names <state root>/products/yoyodyne/dashboard.token, a machine-local
# file outside the repository; this line is the reference, never the token.
services:
  slack:
    enabled: true
  dashboard:
    enabled: true
    token: file

execution:
  max_concurrent_developers: 4  # temporary extra slots, operator 2026-10-02; return to 2 after stuck-slot recovery (yoyodyne-9j7, yoyodyne-ifd.428.68)
  # One developer slot prefers the reliability label, per the operator's
  # direction of 2026-09-19: bugs, anything that keeps the system from
  # stalling, and anything that keeps the system from making mistakes. The
  # mechanism is yoyodyne-ifd.388's and the direction is yoyodyne-ifd.415's;
  # the paste is the operator's own because .yoyodyne/ is a protected path no
  # run may write, so until this line existed the seat was directed and not
  # configured. docs/configuration.md, "A developer slot that prefers a
  # label", is this block and explains what a preference does and does not
  # change: it selects what a slot pulls first, and never what it may do.
  developer_slots:
    - prefer: [reliability]   # slot 1 pulls reliability-labelled work first
    # slots 2 through 4 are not named, so they prefer nothing
  repair_attempts_before_replan: 2
  # A promotion that loses a race -- to another run, or to whoever moved the
  # target branch while this one was working -- is replayed onto where the
  # target went and tried again, up to this many times. Every retry re-runs the
  # checks and asks for a fresh independent review, because the change that
  # would now be promoted is not the one that was approved. A replay that
  # conflicts is never resolved automatically: it stops the run and is left for
  # a person.
  integration_retries_before_reconciliation: 2
  # A provider invocation that dies without judging the work -- an API error its
  # own retries did not outlast, or a response cut off mid-flight -- is reissued
  # in the same worktree and the same session, up to this many times, rather than
  # failing the run. Nothing here is a fault in the change, so a relaunch spends
  # no repair attempt. A run that spends this budget stops and records a blocker.
  transient_relaunches_before_blocking: 2
  worktree_root: auto
  # The remote publishing pushes to and opens pull requests against. It is only
  # consulted when approvals.publishing is automatic; a repository with no
  # remote by this name publishes nothing and stays purely local.
  remote: origin
  # A provider usage limit that is exhausted pauses a run rather than failing
  # it. The maximum covers the five-hour limit and deliberately stops short of
  # the seven-day one, so a capacity problem that needs a person reaches one
  # instead of a timer. The in-process bound is how much of that a run spends
  # sleeping here rather than exiting with its deadline recorded. The unknown
  # reset pause is the interval between probes, whether or not the provider
  # named a reset: a quoted reset bounds the wait rather than gating it, because
  # capacity can be bought and windows can roll before the quoted edge.
  usage_limit_max_pause: 6h
  usage_limit_in_process_pause: 6h
  usage_limit_unknown_reset_pause: 30m
  # A provider whose own servers are transiently overloaded refuses without
  # naming any reset at all, so a run waits this much shorter interval and asks
  # again. It spends the same maximum above, so an overload that never lifts
  # reaches that bound rather than reissuing forever.
  server_overload_pause: 90s
  # The total budget each check below gets. This project runs two developers at
  # once, so two suites contend for the same cores and the wall clock of each is
  # what has to fit here -- the ten-minute flat bound this replaced killed a run
  # whose tests were passing package by package under exactly that contention.
  # Two concurrent runs of the heaviest check here ("make race") finish in about
  # eighty seconds on a sixteen-core machine, so this is generous on purpose.
  check_timeout: 30m
  # Stopgap pending the heavyweight-check capacity design (yoyodyne-ifd.429.43):
  # changes touching many packages need more than 30 minutes for tests and race
  # tests to finish together. Keep every check and gate in place.
  check_stage_timeout: 60m

# Conservative by default: integration and publishing are opted in to
# separately. Automatic integration is refused unless it is actually gated by
# the checks below and a reviewer agent, and publishing is what pushes a branch
# and opens a pull request where other people can see it.
# The recurring tasks: the development manager's hourly sweep, enabled by the
# operator 2026-09-06 the day its machinery landed (yoyodyne-ifd.283). The
# product manager's coherence scan joins here when its successor item ships.
recurring_tasks:
  development-manager-sweep:
    role: development-manager
    # 45m, down from 1h, at the operator's direction of 2026-09-28: a
    # turn more than an hour after the last one re-reads the whole context
    # (the provider's cache lasts an hour), and those cold re-reads were most
    # of this role's spend. Inside the hour, a sweep reuses the cache.
    every: 45m
    enabled: true
    max_turns: 4
    prompt: |
      Sweep for unresolved issues: stoppages nobody has decided, claims on work
      nothing is running, deliveries that have stopped moving. Fix what your
      authority allows, batching classes rather than going item by item; ask
      the architect where a ruling is needed; check findings against work
      already admitted before filing; and file root-cause work with the
      product manager for every fix you make. If a problem you reported
      before comes back after it was handled, that is evidence the handling
      missed: raise it again, citing the earlier report and the recurrence,
      rather than treating "already admitted" as settled.

      Then check everything that appears to wait on the operator: every entry
      naming him on the needs-a-human line, every escalation to him, and
      anything a role has told him is his. The only decision that is truly his
      is a change to the fundamental goals, what the product is for. For each
      other one, settle it yourself if it is yours, or send it to the role
      that owns it, and file a defect with the Lead Product Manager saying why
      it reached him, so the next one does not.

      End with a durable report; when the system is healthy say NO FINDINGS and
      stop.

  product-manager-sweep:
    role: product-manager
    # 45m, down from 12h, at the operator's direction of 2026-09-28: a
    # turn more than an hour after the last one re-reads the whole context
    # (the provider's cache lasts an hour), and those cold re-reads were most
    # of this role's spend. Inside the hour, a sweep reuses the cache.
    every: 45m
    enabled: true
    max_turns: 6
    prompt: |
      Two jobs this pass.

      First, read across the goals, the designs, the decisions, and the
      admitted work, and look for places where they disagree: a goal nothing
      serves, two items that are the same work, an item citing wording a
      document no longer states, a design ruling that never landed, work that
      contradicts a decision already recorded. Fix what your own authority
      covers and elevate the rest. Say what you decided and why.

      Second, decide whether a release should be cut. A release is worth
      cutting when a substantial set of features has actually shipped -- work
      landed and integrated, not merely closed -- and it is worth waiting when
      what has landed since the last one is small or is one unfinished thread.
      Never cut more than one a day. When the answer is yes, admit the release
      work item in this same pass at a priority that gets it built promptly,
      rather than noting it for later. Name in the item what is in the release.

      End with a durable report. Put any questions for the operator at the
      top; when nothing needs him, say so and stop.

  # The architect acts only when spoken to, so work carried in her conversation
  # and proposals to her documents sat for days: on 2026-09-25 eleven items
  # waited on her and her last turn was five days old. The operator added this
  # pass that day. What she rules still needs transcribing into the repository
  # until yoyodyne-ifd.100 gives her a write action, so she says what needs landing.
  architect-pass:
    role: architect
    # 45m, down from 1h, at the operator's direction of 2026-10-04. In her
    # Codex session log, passes opened with 100k to 250k input tokens: gaps of
    # 51 to 56 minutes were 92 to 95 percent cached, while gaps of 57 to 74
    # minutes were mostly 0 percent cached. Five of the last seven opened cold;
    # an hourly cadence plus run time was at the observed cache edge. This is
    # the operator's observation, not a provider guarantee of cache retention.
    every: 45m
    enabled: true
    # 8, up from 4, at the operator's direction of 2026-10-05. A design took
    # her several passes at 4 turns each, so P0 designs queued behind one
    # another for days; the ceiling is MaxRecurringTurns (10).
    max_turns: 8
    prompt: |
      Your recurring pass over what is waiting on you.

      Survey the work items carried in your conversation (executor
      conversation:architect) and the undecided proposals to your documents.
      Take work by priority first, then age within each priority, and rule on
      as many as this pass can do properly rather than touching all of them:
      read each item or proposal in full
      and the documents it rests on before deciding. For each, say plainly
      what you decided, and write any design text so that landing it is
      copying.

      Name anything that needs the operator rather than deciding around it.

      End with a durable report: what you ruled this pass, what needs landing
      in the repository and where, what is still waiting on you and how old
      the oldest is, and any question for the operator at the top. When
      nothing is waiting, say NOTHING WAITING and stop.

approvals:
  brief: human
  goals: human
  designs: automatic
  # This project has opted in to both. The closed loop gates every promotion --
  # checks, an independent reviewer verdict, and conflict-aware fast-forward
  # integration -- and main is protected against direct pushes, so publishing is
  # how work reaches the remote at all: the developer phase pushes its branch
  # and opens a pull request, and the reviewer's approving verdict merges it.
  integration: automatic
  publishing: automatic
  # Goal-level approval operating as ifd.25 designed: the twelve goals are
  # operator-approved, so admission against them flows directly and the
  # operator is told rather than asked. The harness default of human, plus the
  # broken --message proposal decision (ifd.120), had wedged admission
  # entirely on 2026-08-20.
  work_items: automatic

# Checks are this project's own. Each entry is run through "/bin/sh -c" in the
# run's worktree, so shell syntax works. A check must be non-interactive and
# must exit non-zero on failure -- a run stops at a failing check and never
# reaches review or integration. A run with no checks at all is refused, so
# this list is what makes the file usable rather than merely valid:
#
#   # Go
#   checks:
#     - go test ./...
#     - go vet ./...
#     - gofmt -l . | (! grep .)
#
#   # TypeScript / Node
#   checks:
#     - npm ci
#     - npx tsc --noEmit
#     - npm test -- --run
#     - npx eslint .
#
#   # Python
#   checks:
#     - python -m pytest -q
#     - python -m ruff check .
#     - python -m mypy .
#
#   # Java (Maven)
#   checks:
#     - mvn --batch-mode --quiet verify
#
#   # Java (Gradle)
#   checks:
#     - ./gradlew --no-daemon check
checks:
  - make fmtcheck
  - make test
  - make race
  - make vet

path_checks:
  - command: make adoption
    paths: scripts/walk-adoption.paths

# Every agent is stated in full: nothing about them is inherited. A model
# selector that names a family, such as "opus", floats to that family's current
# default; an exact identifier such as claude-opus-5 pins a version. Persona
# paths are relative to this .yoyodyne directory and must be Markdown inside it.
# Delete an agent to remove it, edit one to change it.
# The architect and development manager prefer Codex Astra, with Claude Fable
# as fallback (operator, 2026-10-03). Product managers retain Fable with Astra
# fallback. Cross-provider failover currently covers conversation turns only.
agents:
  architect:
    role: architect
    backend: codex
    model: gpt-6-astra
    failover:
      enabled: true
      model: fable
      provider: claude-code
    instances: 1
    persona:
      version: v2
      path: personas/architect.md
  developer:
    role: developer
    backend: codex
    model: gpt-6.1-sol
    # One instance per configured developer slot.
    instances: 4
    persona:
      version: v2
      path: personas/developer.md
  # The first program manager, created on the operator's direction of
  # 2026-09-25: it owns the factory not getting stuck or halting on a person.
  # docs/designs/program-manager.md; its passes fire on the triggers below.
  factory-flow-pm:
    role: program-manager
    backend: claude-code
    model: fable
    effort: high
    failover:
      enabled: true
      model: gpt-6-astra
      provider: codex
    instances: 1
    persona:
      version: v3
      path: personas/program-manager.md
    lane: factory-flow
    remit:
      version: r2
      path: remits/factory-flow.md
    triggers:
      # Every 45 minutes, down from 2h, at the operator's direction of
      # 2026-09-28: each pass re-reads ~870,000 tokens of context, and the
      # provider's cache of it expires within the hour, so a 2h schedule paid a
      # full re-read (~$17) every pass while a pass inside the hour pays well
      # under $1. Shrinking the context itself is yoyodyne-ifd.430.13.8.
      every: 45m
      on: [admissions, stoppages]
  development-manager:
    role: development-manager
    backend: codex
    model: gpt-6-astra
    failover:
      enabled: true
      model: fable
      provider: claude-code
    instances: 1
    persona:
      version: v2
      path: personas/development-manager.md
  product-manager:
    role: product-manager
    backend: claude-code
    model: fable
    effort: high
    failover:
      enabled: true
      model: gpt-6-astra
      provider: codex
    instances: 1
    persona:
      version: v2
      path: personas/product-manager.md
  reviewer:
    role: reviewer
    backend: codex
    model: gpt-6.1-sol
    # Raised 1->2 alongside max_concurrent_developers: 3 so reviews don't
    # queue behind one instance when the slots fill (operator, 2026-09-04).
    instances: 2
    persona:
      version: v2
      path: personas/reviewer.md
