name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A merge queue on main tests each queued merge before it lands, and waits
  # for the required checks on that merge; without this trigger they never run.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A module proxy or network that fails for a moment is not this tree
      # failing, so the download is tried three times before the job goes red,
      # and a job that does go red here says it was the download.
      - name: Download dependencies
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              exit 0
            fi
            echo "::warning::go mod download failed (attempt ${attempt} of 3); trying again" >&2
            sleep 10
          done
          echo "::error::go mod download failed three times: the module proxy or the network, not this tree" >&2
          exit 1

      - name: Verify dependencies
        run: go mod verify

      - name: Check
        run: make check

      - name: Build
        run: make build

      # The release path runs here, on every change, rather than first executing
      # during a tag push where a failure means a botched or absent release.
      # This is the same `make dist` a release runs: it cross-compiles every
      # platform in PLATFORMS, packages and checksums them, then unpacks the
      # runner's own archive and asserts the binary names the version it was
      # built from.
      - name: Package a release and verify it names its version
        run: make dist-verify VERSION=v0.0.0-ci

      # The release verb's value is the cuts it refuses, and a refusal nobody
      # exercises is a refusal nobody has. This runs those against fabricated
      # repositories rather than this one, so it needs no provider, no network,
      # and no cross-compile.
      - name: Check that the release verb refuses what it should
        run: scripts/cut-release-test.sh

      # And that the notes it gates on say what landed, in the shape the
      # operator asked for, and that the release page's body is composed from
      # them. Fabricated repository, stub tracker: no provider, no network, and
      # this repository's own history is never read. The body composition is
      # covered here because its only other execution is a real publication.
      - name: Check a release's notes and the body they are published as
        run: bash scripts/release-notes-test.sh

      # The install script runs on machines nobody here controls, and the states
      # worth testing -- a platform with no release binary, a download that is
      # not what the release published, a PATH the binary is not on, a missing
      # prerequisite -- are none of them this runner's. They are fabricated
      # instead, so this needs no network and no published release. `make test`
      # runs the same suite from a Go test, so a run applies it too; this step
      # is the one that prints its own report on the pull request.
      - name: Check that the install script works on a machine that has nothing
        run: bash scripts/install-test.sh

  # The README's "Getting started" is a claim a stranger acts on, and until this
  # job existed the only thing standing behind it was somebody remembering to
  # run `make adoption` before merging a change to those sections. That is an
  # assertion rather than a gate, which is what the README split was not allowed
  # to leave behind: a section that moved out of the README is a step a newcomer
  # can no longer take, and only executing the section says whether that
  # happened.
  #
  # It is a job of its own rather than a step in `build` because it needs a tool
  # `make check` does not -- the tracker -- and because it is independent of
  # everything above it, so it runs beside the build rather than after it.
  adoption:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The tracker version this job installs, written once and used by every
      # step below that needs it. The pin belongs to this repository rather than
      # to the upstream: nothing here follows somebody else's release schedule,
      # and the version moves when a person edits this line and nothing else.
      # docs/developing-yoyo.md#the-tracker-version-ci-pins is who owns it and
      # how to move it.
      BD_VERSION: 1.2.2
    steps:
      - uses: actions/checkout@v7

      # This job gets a current Go rather than the repository's own version:
      # it installs the tracker, whose releases (v1.1.2 onward) require a newer
      # Go than this project pins for itself. The build job keeps go.mod's
      # version; only the walkthrough's toolchain floats.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # The walkthrough runs `bd init` against its own scratch project, so the
      # tracker has to be here. The upstream's prebuilt release binary, pinned:
      # `go install` of this tool now needs a newer Go than this repo pins, a
      # module path its own tags disagree about, and a C++ ICU toolchain — all
      # of which broke every PR here on 2026-09-05 when @latest moved. A pinned
      # binary has none of those moving parts; bump the version deliberately.
      #
      # Every failure here names the pin rather than the walkthrough, because a
      # bump gone wrong is what this step exists to catch: a release that is not
      # there to download, an archive with no binary in it, and a binary that
      # reports some version other than the one asked for. A download that fails
      # is retried first, and still failing names the network beside the pin,
      # because the release host failing for a moment is not a bump gone wrong.
      - name: Install the tracker the walkthrough needs
        run: |
          set -euo pipefail
          release="https://github.com/gastownhall/beads/releases/download/v${BD_VERSION}/beads_${BD_VERSION}_linux_amd64.tar.gz"
          # Retried, because a release host that fails for a moment is not the
          # pin being wrong. A release that is not there answers 404 on every
          # try, which is what the error below is about.
          if ! curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 -o /tmp/beads.tar.gz "$release"; then
            echo "::error::The pinned tracker v${BD_VERSION} did not download from ${release} after five tries. Either the network or GitHub's release host failed for longer than that, or BD_VERSION in this workflow names a release that is not there: see docs/developing-yoyo.md#the-tracker-version-ci-pins" >&2
            exit 1
          fi
          # Unpacked into a directory of its own: a find over the shared /tmp
          # trips on the runner's unreadable service directories, and under
          # pipefail that exit status is the step's, before any error line.
          unpacked=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$unpacked"
          BD=$(find "$unpacked" -maxdepth 2 -name bd -type f | head -1)
          if [ -z "$BD" ]; then
            echo "::error::The archive for the pinned tracker v${BD_VERSION} carries no bd binary where this expects one. What is wrong is BD_VERSION in this workflow, not the adoption walkthrough: see docs/developing-yoyo.md#the-tracker-version-ci-pins" >&2
            exit 1
          fi
          install -m 0755 "$BD" /usr/local/bin/bd 2>/dev/null || sudo install -m 0755 "$BD" /usr/local/bin/bd
          # Failure and all: a binary that installed and will not run reports
          # nothing the pin is named in, and the version check below is what
          # says so.
          installed=$(bd version 2>&1 || true)
          echo "$installed"
          case "$installed" in
            *"${BD_VERSION}"*) ;;
            *)
              echo "::error::The tracker installed reports '${installed}', which does not name the pinned v${BD_VERSION}. What is wrong is BD_VERSION in this workflow, not the adoption walkthrough: see docs/developing-yoyo.md#the-tracker-version-ci-pins" >&2
              exit 1
              ;;
          esac

      # A bump is verified rather than trusted. These are the checks that pin
      # every bd behavior the harness assumes -- they skip on a machine with no
      # tracker, which is every machine `make check` runs on that has not
      # installed one, and here they run against the binary just pinned. So a
      # version that changed one of those behaviors fails here, naming the
      # assumption it broke, rather than surfacing further down as a walkthrough
      # that stopped working.
      #
      # -count=1 because the Go test cache is keyed on this repository's own
      # inputs and not on which bd is on PATH: a change that moves BD_VERSION
      # alone would otherwise replay a pass recorded against the version before
      # it, which is exactly the change this step is for.
      - name: Check the pinned tracker behaves as the harness assumes
        run: |
          set -uo pipefail
          if ! go test ./internal/beads -run Conformance -count=1; then
            echo "::error::The tracker pinned at v${BD_VERSION} no longer behaves as this repository assumes; the failure above names the assumption. Where this change moved BD_VERSION, that version change is what to reconsider: see docs/developing-yoyo.md#the-tracker-version-ci-pins" >&2
            exit 1
          fi

      # `make adoption` builds this checkout's own binary and walks the
      # documented steps against a throwaway Python project -- its own scratch
      # repository and state directory, removed when it exits -- so nothing an
      # operator owns is touched. WALK_PROVIDER is left unset, so no provider is
      # invoked and no capacity is spent; the walkthrough names that step as
      # skipped rather than passing over it.
      - name: Walk the documented adoption path
        run: make adoption
