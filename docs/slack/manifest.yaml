# The Slack app Yoyodyne reports through.
#
# This is a Slack app manifest: paste it into
# https://api.slack.com/apps → "Create New App" → "From an app manifest", and
# Slack creates the app with exactly the scopes, settings, and event
# subscriptions below. It is checked in so the app an operator installs is
# reviewed with the code rather than assembled by hand from a list of checkboxes
# — two workspaces set up a month apart get the same app.
#
# Setting it up from nothing is docs/slack/setup.md, beside this file.
#
# The scopes are the least the design needs, and each is here for one reason:
#
#   chat:write             post messages. Without it the sink reports nothing.
#   chat:write.customize   post under a per-message name and icon, so one
#                          channel can carry more than one speaker rather than
#                          everything arriving from one bot. Each role speaks
#                          under its own name and face, and what no persona did
#                          arrives from the harness itself; without this scope
#                          the voice would be the only thing telling them apart.
#   reactions:write        mark the message a thread hangs from with what its
#                          item is doing — working, with the reviewer, blocked,
#                          landed — and take the mark off again as the record
#                          moves. It is what makes the channel's top level a
#                          status board that answers which threads need somebody
#                          without any of them being opened. Without it the
#                          messages are unaffected and the marks are simply
#                          absent.
#   im:write               open the direct conversation with an operator the
#                          project authorized by name, which is what
#                          `conversations.open` needs and what the message is then
#                          posted into. It is used for two classes of message and
#                          only those two. The first is the harness itself being
#                          degraded: a session choosing work from a build long
#                          before the fixes it is about to spend rounds
#                          rediscovering, the harness having started nothing at
#                          all while work was ready, the provider holding every
#                          role, a brake hold handed to a person, a recurring task
#                          failing before its first turn for two hours, an item
#                          that sat claimed with nothing working on it, a
#                          provider nobody is logged into or nobody can reach
#                          (with the command that logs it in, repeated at most
#                          hourly, and a note when it answers again), and a line
#                          that has stopped over ready work — the one of them put
#                          to each operator personally with the answers numbered,
#                          because that state costs an hour of the machine doing
#                          nothing for every hour nobody sees it. The second is
#                          advisory-once: a fact said exactly once, which today is
#                          a value the project's template has improved that this
#                          project never edited. A channel is somewhere somebody
#                          chooses to look, and that is exactly what nobody thinks
#                          to look for at three in the morning. Without it every
#                          one of those is still in the channel and the refusal is
#                          said in the sink's log; nobody is asked. docs/slack/
#                          setup.md step 1 has the whole list.
#   im:history             read what is said in a direct message with the app:
#                          the reply that answers one of those asks, and a message
#                          there that @-mentions the app, which is answered as one
#                          in the channel is. The reply is the decision: it is
#                          recorded as an operational directive in the same record
#                          every run reads, and nothing is carried out on its own.
#                          The message events are scoped to conversations this app
#                          is in, so what it can read is the channel it was invited
#                          to and its own direct messages — never anybody else's.
#   channels:history       read what is typed in the channel, in public channels.
#                          It is what carries a message back to the machine the
#                          harness runs on, and two things are done with one: a
#                          reply in a thread the sink opened, from somebody the
#                          project authorized by name, is recorded as a directive
#                          against that thread's work item where it is an
#                          instruction and answered by the Lead Product Manager where
#                          it is a question, and anybody else's is answered
#                          saying it was not acted on; and a message
#                          anywhere else that @-mentions the app is answered
#                          where it was said and noted, with what was asked, in
#                          the sink's own log — it records no directive and moves
#                          no work, because a question the app never answers
#                          reads as a dead sink. An operator who wants neither
#                          can remove it and the two message events below, and
#                          nothing typed in the channel then arrives.
#   groups:history         the same, for a private channel.
#
# Socket Mode is on and there is no request URL, which is the point: the harness
# runs on operators' machines behind NAT, and the Events API would demand a
# public HTTPS endpoint per operator.
#
# The two descriptions below are folded (">-") rather than literal ("|"), and
# that is not a style choice. Slack renders the About text exactly as it arrives,
# so a literal block ships this file's own line wrapping as hard breaks
# mid-sentence — the profile reads as a column of broken lines. Folding joins
# each wrapped paragraph back into one line, which leaves the break between the
# two paragraphs as the only one in the text, where it is meant to be.
#
# The doubled blank line inside long_description is deliberate and not a stray:
# a folded scalar collapses n+1 line breaks into n, so one empty line would give
# the two paragraphs a bare line break and two give them the empty line between
# them. Rewrap these paragraphs freely; just keep exactly two empty lines there,
# which is what renders as one blank line. Three would render as two.
#
# One part of the profile is not here at all: a manifest cannot carry an image,
# so the app's icon is uploaded by hand. It is already checked in, as
# docs/slack/app-icon-v1.png beside this file and beside the role faces in
# docs/slack/avatars/, and step 1 of setup.md walks the upload.
display_information:
  name: Yoyodyne
  # What it is, in one line. The About text below is the fuller story, so this
  # one does not start telling it.
  description: >-
    Yoyodyne runs development work on your own machine. This is where you watch
    it happen.
  long_description: >-
    A work item gets a thread, and everything that happens to it is a message in
    that thread: the run starting and why that item was chosen, the checks
    passing or failing, the reviewer's verdict, the promotion onto the target
    branch. Every report an agent files is carried through word for word, at the
    severity it was filed under, and each role speaks under its own name and
    face — the developer about the change it is making, the reviewer about the
    change it is judging. What no persona did, like a promotion or a merge,
    arrives from Yoyodyne itself.


    It posts from the record rather than acting on it. A separate process you
    start reads the harness's own durable records, so a workspace that is down
    delays messages rather than losing them. Replies go the other way: an
    instruction in a work item's thread, from somebody the project has
    authorized by name, is recorded as a directive against that item, and a
    question there is answered by the Lead Product Manager. Nobody else's reply
    changes anything, and a project that has authorized nobody is steered by
    nobody.

    One thing it asks rather than reports. When the line stops over ready
    work, it messages each authorized person directly with the options
    numbered, and their reply in that thread is the decision, recorded where
    every run reads it.
  background_color: "#1f2933"
features:
  bot_user:
    display_name: yoyodyne
    # The harness is not a person waiting to be messaged: it posts when
    # something happens and is otherwise quiet.
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.customize
      - reactions:write
      - im:write
      - im:history
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
  interactivity:
    # Buttons and menus are a control surface, and this app is a reporting one.
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
